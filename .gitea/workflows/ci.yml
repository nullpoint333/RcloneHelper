# Gitea Actions：编译 + 单元测试
#
# runner：nas-runner（标签 ubuntu-latest / ubuntu-24.04 / ubuntu-22.04）
# 说明：本实例 runner 可能没有外网（微软 CDN），所以 .NET SDK 采用
#       “自带就用、没有就限时自举、仍失败则跳过构建” 的策略，避免流水线挂死。
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 .NET SDK（有网自举 / 无网跳过）
        id: dotnet
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            echo "runner 已自带 dotnet: $(dotnet --version)"
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "runner 未安装 dotnet，尝试自举（最长 300s）"
          if curl -fsSL --connect-timeout 15 --max-time 90 -o /tmp/dotnet-install.sh https://dot.net/v1/dotnet-install.sh \
             && timeout 300 bash /tmp/dotnet-install.sh --version 10.0.401 --install-dir "$HOME/.dotnet"; then
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
            dotnet --version || true
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::runner 无法获取 .NET SDK（大概率无外网），跳过构建与测试。"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 还原依赖
        if: steps.dotnet.outputs.available == 'true'
        run: dotnet restore RcloneHelper.sln

      - name: 构建
        if: steps.dotnet.outputs.available == 'true'
        run: dotnet build RcloneHelper.sln -c Release --no-restore

      - name: 单元测试
        if: steps.dotnet.outputs.available == 'true'
        run: dotnet test RcloneHelper.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: 跳过说明
        if: steps.dotnet.outputs.available != 'true'
        run: echo "本次未执行构建：runner 没有 .NET SDK 且无法下载。源码可用性由本地环境保证。"
