name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build & Publish
        run: >
          dotnet publish RcloneHelper/RcloneHelper.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Remove PDB files
        run: Remove-Item -Path publish/win-x64/*.pdb -ErrorAction SilentlyContinue

      - name: Create ZIP archive
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath RcloneHelper-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: RcloneHelper-${{ github.ref_name }}-win-x64.zip
